# Test deployment on Fly.io. SQLite lives on one volume, so this must stay a single machine.
# The app name must be globally unique: change it (or run `fly launch --copy-config`).
app = "acct-test"
primary_region = "syd"

[build]

[mounts]
  source = "acct_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

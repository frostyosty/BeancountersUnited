[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/server",
    "crates/import",
    "crates/ai",
    "crates/pdf",
    "apps/desktop/shell",
    "apps/desktop/dev",
]
# Plain `cargo build`, `test` and `clippy` skip the desktop apps: they need the system webview
# libraries (see ADR 006). `make desktop` and `make desktop-check` build and check them.
default-members = ["crates/core", "crates/store", "crates/server", "crates/import", "crates/ai", "crates/pdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
acct-core = { path = "crates/core" }
acct-store = { path = "crates/store" }
acct-import = { path = "crates/import" }
acct-ai = { path = "crates/ai" }
acct-pdf = { path = "crates/pdf" }
acct-server = { path = "crates/server" }
acct-desktop = { path = "apps/desktop/shell" }

argon2 = "0.6"
axum = "0.8"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
getrandom = "0.4"
insta = "1"
# Only in acct-pdf's tests, to read back the PDFs it writes (ADR 010).
lopdf = "=0.46.0"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "query"] }
rpassword = "7"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tauri = { version = "2.11", features = ["custom-protocol"] }
tauri-build = { version = "2.6", features = [] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The PDF renderer (ADR 010). Pinned exactly: upgrading may change PDF bytes, so it's its own commit.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Password hashing is deliberately slow; unoptimised it makes tests and `make dev` logins crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Full debug info filled disks: a Codespace's 32 GB with Tauri's dependencies, then 60 GB of a
# Windows target/ with every test binary carrying its own. Line tables keep panics and backtraces
# readable (file and line); stepping through variables in a debugger needs this raised locally.
[profile.dev]
debug = "line-tables-only"
